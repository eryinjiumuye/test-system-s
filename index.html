<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>問題・解答共有システム</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
    <div class="site-title">問題・解答共有システム</div>

    <button id="admin-button" class="admin-button">
        管理者モード
    </button>
</header>


<main>

    <!-- =========================
         一般ユーザー画面
    ========================== -->

    <section id="user-area">

        <!-- 招待コード -->
        <div id="invite-screen" class="screen">

            <h1>問題・解答共有システム</h1>

            <p>
                招待コードを入力してください。
            </p>

            <input
                id="invite-code"
                type="text"
                placeholder="招待コード"
            >

            <button id="invite-button">
                入室
            </button>

            <p id="invite-error" class="error"></p>

        </div>


        <!-- 科目選択 -->
        <div id="subject-screen" class="screen hidden">

            <h1>科目を選択</h1>

            <div id="subject-list" class="card-list"></div>

        </div>


        <!-- 大問選択 -->
        <div id="problem-screen" class="screen hidden">

            <button id="back-to-subjects" class="back-button">
                ← 科目選択に戻る
            </button>

            <h1 id="problem-title">
                大問を選択
            </h1>

            <div id="problem-list" class="card-list"></div>

        </div>


        <!-- 小問選択 -->
        <div id="question-screen" class="screen hidden">

            <button id="back-to-problems" class="back-button">
                ← 大問選択に戻る
            </button>

            <h1 id="question-title">
                小問を選択
            </h1>

            <div id="question-list" class="card-list"></div>

        </div>


        <!-- 解答 -->
        <div id="answer-screen" class="screen hidden">

            <button id="back-to-questions" class="back-button">
                ← 小問選択に戻る
            </button>

            <div class="breadcrumb" id="breadcrumb"></div>

            <h1 id="answer-question-name"></h1>


            <section class="answer-section">

                <h2>問題</h2>

                <div
                    id="answer-problem"
                    class="content-box"
                ></div>

            </section>


            <section class="answer-section">

                <h2>答え</h2>

                <div
                    id="answer-answer"
                    class="content-box answer-box"
                ></div>

            </section>


            <section class="answer-section">

                <h2>解説</h2>

                <div
                    id="answer-explanation"
                    class="content-box"
                ></div>

            </section>


            <section
                id="answer-image-section"
                class="answer-section hidden"
            >

                <h2>画像</h2>

                <div class="image-container">
                    <img
                        id="answer-image"
                        alt="問題画像"
                    >
                </div>

            </section>

        </div>

    </section>



    <!-- =========================
         管理者ログイン
    ========================== -->

    <section id="admin-login-screen" class="screen admin-screen hidden">

        <h1>管理者ログイン</h1>

        <div class="form-group">

            <label for="admin-email">
                メールアドレス
            </label>

            <input
                id="admin-email"
                type="email"
                placeholder="メールアドレス"
            >

        </div>


        <div class="form-group">

            <label for="admin-password">
                パスワード
            </label>

            <input
                id="admin-password"
                type="password"
                placeholder="パスワード"
            >

        </div>


        <button id="admin-login-button">
            ログイン
        </button>

        <button id="admin-login-back" class="secondary-button">
            戻る
        </button>

        <p id="admin-login-error" class="error"></p>

    </section>



    <!-- =========================
         管理者画面
    ========================== -->

    <section id="admin-area" class="screen admin-screen hidden">

        <div class="admin-header">

            <div>
                <h1>管理者モード</h1>
                <p id="admin-email-display"></p>
            </div>

            <button id="logout-button" class="logout-button">
                ログアウト
            </button>

        </div>


        <!-- 科目管理 -->
        <div id="admin-subject-screen">

            <div class="admin-section-header">

                <h2>科目管理</h2>

                <button id="add-subject-button">
                    ＋ 科目を追加
                </button>

            </div>

            <div
                id="admin-subject-list"
                class="admin-list"
            ></div>

        </div>


        <!-- 大問管理 -->
        <div
            id="admin-problem-screen"
            class="hidden"
        >

            <button
                id="admin-back-subjects"
                class="back-button"
            >
                ← 科目管理に戻る
            </button>

            <div class="admin-section-header">

                <h2 id="admin-problem-title">
                    大問管理
                </h2>

                <button id="add-problem-button">
                    ＋ 大問を追加
                </button>

            </div>

            <div
                id="admin-problem-list"
                class="admin-list"
            ></div>

        </div>


        <!-- 小問管理 -->
        <div
            id="admin-question-screen"
            class="hidden"
        >

            <button
                id="admin-back-problems"
                class="back-button"
            >
                ← 大問管理に戻る
            </button>

            <div class="admin-section-header">

                <h2 id="admin-question-title">
                    小問管理
                </h2>

                <button id="add-question-button">
                    ＋ 小問を追加
                </button>

            </div>

            <div
                id="admin-question-list"
                class="admin-list"
            ></div>

        </div>


        <!-- 小問編集 -->
        <div
            id="admin-question-editor"
            class="editor hidden"
        >

            <button
                id="admin-editor-back"
                class="back-button"
            >
                ← 小問一覧に戻る
            </button>

            <h2 id="editor-title">
                小問を編集
            </h2>


            <div class="form-group">

                <label for="edit-question-name">
                    小問名
                </label>

                <input
                    id="edit-question-name"
                    type="text"
                    placeholder="例：(1)"
                >

            </div>


            <div class="form-group">

                <label for="edit-question-problem">
                    問題
                </label>

                <textarea
                    id="edit-question-problem"
                    rows="6"
                    placeholder="問題文を入力してください"
                ></textarea>

            </div>


            <div class="form-group">

                <label for="edit-question-answer">
                    答え
                </label>

                <textarea
                    id="edit-question-answer"
                    rows="4"
                    placeholder="答えを入力してください"
                ></textarea>

            </div>


            <div class="form-group">

                <label for="edit-question-explanation">
                    解説
                </label>

                <textarea
                    id="edit-question-explanation"
                    rows="8"
                    placeholder="解説を入力してください"
                ></textarea>

            </div>


            <!-- 画像 -->
            <div class="form-group">

                <label>
                    問題画像
                </label>

                <input
                    id="edit-question-image-file"
                    type="file"
                    accept="image/png,image/jpeg,image/webp"
                >

                <div
                    id="current-image-area"
                    class="current-image-area"
                ></div>

                <button
                    id="remove-image-button"
                    type="button"
                    class="danger-button hidden"
                >
                    画像を削除
                </button>

            </div>


            <div class="editor-buttons">

                <button
                    id="save-question-button"
                >
                    保存
                </button>

                <button
                    id="cancel-question-button"
                    class="secondary-button"
                >
                    キャンセル
                </button>

            </div>

            <p
                id="question-save-message"
                class="message"
            ></p>

        </div>

    </section>

</main>


<script src="app.js"></script>

</body>
</html>
